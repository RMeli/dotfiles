spack:
  specs:
  # Development
  - llvm
  - cmake
  - ninja
  - hwloc
  - libtree
  - tmux
  - direnv
  - htop +hwloc
  - neovim
  - ripgrep
  - fzf
  - ruby
  - go
  - node-js
  - npm
  - ccache
  - python
  - bat
#  - eza
  - jq
  - yq
  - btop
  - gh
  - starship
  - neovim
  concretizer:
    unify: true
  packages:
    all:
      require:
      - ~cuda
      - ~rocm
    c:
      prefer:
      - 'apple-clang'
    cxx:
      prefer:
      - 'apple-clang'
    llvm:
      require:
      - '@23'
      - targets=aarch64
      - ~gold
      - ~libomptarget
    python:
      require:
        - '@3.14'
  view:
    default:
      root: ~/dev-aarch64.view
      link: roots
  config:
    # Custom install tree
    # Does not interfere with Spack packages in the default location
    install_tree:
      root: ~/.dev-aarch64.install_tree
